name: Foundations

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Check the lockfile has no external crates
        shell: pwsh
        run: |
          if (Select-String -Path Cargo.lock -Pattern '^source\s*=') {
            throw 'Cargo.lock contains an external package source'
          }
      - name: Reject direct std::net imports
        shell: pwsh
        run: |
          $networkReferences = Get-ChildItem crates -Recurse -Filter *.rs | Select-String -Pattern '\bstd\s*::\s*net\b'
          if ($networkReferences) { throw 'Direct std::net reference found in engine code' }
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace --all-targets --locked --offline
      - name: Test
        run: cargo test --workspace --locked --offline
      - name: Test optimized build
        run: cargo test --workspace --release --locked --offline
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Produce debug fixture bytes
        run: cargo run --locked --offline -p prism-local-core --bin foundation-golden -- foundation-debug.bin
      - name: Produce release fixture bytes
        run: cargo run --release --locked --offline -p prism-local-core --bin foundation-golden -- foundation-release.bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-${{ runner.os }}
          path: |
            foundation-debug.bin
            foundation-release.bin
          if-no-files-found: error
          retention-days: 7

  linux-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned toolchain and musl target
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup target add --toolchain 1.100.0 x86_64-unknown-linux-musl
      - name: Test musl release
        run: cargo test --workspace --target x86_64-unknown-linux-musl --release --locked --offline
      - name: Build sidecar and check static linkage
        run: |
          cargo build -p prism-local --target x86_64-unknown-linux-musl --release --locked --offline
          readelf -l target/x86_64-unknown-linux-musl/release/prism-local > target/musl-headers.txt
          if grep -q INTERP target/musl-headers.txt; then echo 'Unexpected ELF interpreter'; exit 1; fi
          readelf -d target/x86_64-unknown-linux-musl/release/prism-local > target/musl-dynamic.txt
          if grep -q '(NEEDED)' target/musl-dynamic.txt; then echo 'Unexpected shared library'; exit 1; fi
      - name: Produce musl fixture bytes
        run: cargo run --target x86_64-unknown-linux-musl --release --locked --offline -p prism-local-core --bin foundation-golden -- foundation-musl.bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-Musl
          path: foundation-musl.bin
          if-no-files-found: error
          retention-days: 7

  compare-foundation-bytes:
    needs: [checks, linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: foundation-*
          path: fixtures
      - name: Compare Windows and Linux bytes
        run: |
          cmp fixtures/foundation-Windows/foundation-debug.bin fixtures/foundation-Linux/foundation-debug.bin
          cmp fixtures/foundation-Windows/foundation-release.bin fixtures/foundation-Linux/foundation-release.bin
          cmp fixtures/foundation-Windows/foundation-debug.bin fixtures/foundation-Windows/foundation-release.bin
          cmp fixtures/foundation-Linux/foundation-debug.bin fixtures/foundation-Linux/foundation-release.bin
          cmp fixtures/foundation-Linux/foundation-release.bin fixtures/foundation-Musl/foundation-musl.bin
