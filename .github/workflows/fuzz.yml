name: Fuzz

on:
  pull_request:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "120"

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Build coverage-guided engine
        shell: bash
        run: bash fuzz/engine/build.sh
      - name: Fuzz every corpus target
        shell: bash
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '120' }}
        run: bash fuzz/engine/run.sh "$SECONDS_PER_TARGET" target/fuzz-work
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fuzz-${{ matrix.os }}
          path: target/fuzz-work
          retention-days: 30
          if-no-files-found: error
